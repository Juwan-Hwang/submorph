[package]
name = "submorph"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local, lossless subscription converter: Clash/Mihomo, sing-box, share links and Base64 subscriptions in; mihomo and sing-box configs out, with per-item diagnostics."
license = "MIT"
readme = "README.md"
keywords = ["clash", "mihomo", "sing-box", "subscription", "converter"]
categories = ["command-line-utilities", "parser-implementations"]

[lib]
name = "submorph"
path = "src/lib.rs"

[[bin]]
name = "submorph"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = []

[dependencies]
base64 = "0.23.1"
saphyr-parser = "0.3.4"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
percent-encoding = "2.3"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }

[profile.release]
lto = "thin"
codegen-units = 1
